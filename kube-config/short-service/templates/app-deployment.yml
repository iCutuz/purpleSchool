apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}-deployment
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      components: {{ .Values.app.components }}
  template:
    metadata:
      name: {{ .Values.app.name }}
      labels:
        components: {{ .Values.app.components }}
    spec:
      containers:
        - name: {{ .Values.app.name }}
          image: "{{ .Values.app.image }}:{{ .Values.app.version }}"
          ports:
            - containerPort: {{ .Values.app.port }}
          resources:
            requests:
              memory: {{ .Values.app.resources.memory }}
              cpu: {{ .Values.app.resources.cpu }}
            limits:
              memory: {{ .Values.app.resources.memorylimit }}
              cpu: {{ .Values.app.resources.cpulimit }}
