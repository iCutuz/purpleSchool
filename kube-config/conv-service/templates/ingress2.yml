apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myingress
  annotations:
    nginx.ingress.kubernetes.io/add-base-url: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: {{ .Values.name }}-clusterip
                port:
                  number: {{ .Values.app.ports }}
          - pathType: Prefix
            path: "/api"
            backend:
              service:
                name: conv-api-clusterip
                port:
                  number: 3000
          - pathType: Prefix
            path: "/uploads"
            backend:
              service:
                name: converter-clusterip
                port:
                  number: 82
